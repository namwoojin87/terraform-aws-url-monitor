name: Terraform Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install pinned security scanner
        run: python -m pip install -r requirements-security.txt
      - name: Verify security gate against real fixtures
        run: python -m pytest tests/test_security_scan.py -q
      - name: Scan all Terraform and write evidence
        run: python security/scan.py
      - name: Publish scan summary
        if: always()
        shell: bash
        run: |
          if [[ -f security/reports/summary.md ]]; then
            cat security/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Security evidence is unavailable because the scanner or its verification did not complete.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: terraform-security-evidence
          path: security/reports/
          retention-days: 14
          if-no-files-found: error
