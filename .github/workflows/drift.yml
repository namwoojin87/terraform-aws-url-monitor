name: Terraform Drift Check

on:
  schedule:
    - cron: "17 0 * * 1" # Monday 09:17 Asia/Seoul (UTC+9)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-drift
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-northeast-2

jobs:
  drift:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: url-monitor-drift
      - name: Initialize backend
        run: >-
          terraform -chdir=infra init -input=false -lockfile=readonly
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=infra/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Check drift and publish safe summary
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: python scripts/drift_check.py
